<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout TRPG</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 20%;
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 80%;
            float: left;
            padding: 10px;
            box-sizing: border-box;
        }
        .menu a {
            color: #00ee00;
            text-decoration: none;
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            text-align: center;
            cursor: pointer;
        }
        .menu a:hover {
            background-color: #00ee00;
            color: #000000;
        }
        #chat-area div {
            margin-bottom: 15px;
        }
        .chat-area strong {
            display: block;
            font-weight: bold;
            margin-bottom: 3px;
            color: #00ee00;
        }
        input, button {
            background-color: #000000;
            color: #00ee00;
            border: 1px solid #00ee00;
            padding: 5px;
            margin: 5px 0;
        }
        input {
            width: calc(100% - 12px);
        }
        button:hover {
            background-color: #00ee00;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Fallout TRPG</h1>
        <button onclick="createNewGame()">Vytvořit novou hru</button>
        <div id="game-list">
            <p>Momentálně nejsou k dispozici žádné hry.</p>
        </div>
    </div>
    <div class="content">
        <img src="https://via.placeholder.com/800x400" alt="Popis obrázku místnosti" id="room-image" style="width: 100%; height: auto;" />
        <p id="room-description">Místnost: N/A. Popis: Zde je popis místnosti.</p>
        <div id="chat-controls" style="display: none;">
            <input type="text" id="player-name" placeholder="Zadejte jméno postavy..." />
            <div id="chat-area"></div>
            <input type="text" id="message-input" placeholder="Napište zprávu..." />
            <button onclick="sendMessage()">Odeslat</button>
            <button onclick="summonAI()">Přizvat AI vypravěče</button>
        </div>
    </div>

    <script>
        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                const gameList = document.getElementById("game-list");
                const newGame = document.createElement("button");
                newGame.textContent = gameName;
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        function enterGame(gameName) {
            document.getElementById("room-description").textContent = `Místnost: ${gameName}. Popis: Tady je popis místnosti.`;
            document.getElementById("chat-controls").style.display = "block";
        }

        function sendMessage() {
            const inputField = document.getElementById('message-input');
            const message = inputField.value.trim();
            const chatArea = document.getElementById('chat-area');
            const playerNameInput = document.getElementById('player-name');
            const playerName = playerNameInput.value.trim() || 'Neznámý hráč';

            if (message) {
                const messageContainer = document.createElement('div');
                const playerNameElement = document.createElement('strong');
                playerNameElement.textContent = playerName + ':';
                messageContainer.appendChild(playerNameElement);

                const messageText = document.createElement('p');
                messageText.textContent = message;
                messageText.style.margin = '5px 0 10px';
                messageContainer.appendChild(messageText);

                chatArea.appendChild(messageContainer);
                inputField.value = ''; // Vymazat textové pole
            }
        }

        function summonAI() {
            alert("Funkce přizvání AI vypravěče bude implementována později.");
        }
    </script>
</body>
</html>
