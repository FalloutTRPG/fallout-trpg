<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout TRPG</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 20%;
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 80%;
            float: left;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
            border-bottom: 1px solid #00ee00;
        }
        .input-area {
            padding: 10px;
            background-color: #000000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-area input, .input-area textarea, .input-area button {
            width: calc(100% - 20px);
            padding: 10px;
            background-color: #000000;
            color: #00ee00;
            border: 1px solid #00ee00;
            border-radius: 5px;
            font-family: Futura, sans-serif;
        }
        .input-area button {
            cursor: pointer;
        }
        .input-area input:focus, .input-area textarea:focus, .input-area button:focus {
            outline: none;
            border-color: #00ff00;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            border-radius: 5px;
            text-align: justify;
            white-space: pre-wrap; /* Zachová formátování odstavců */
        }
        .message strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="main-page">
        <div class="menu">
            <h1>Fallout TRPG</h1>
            <a href="#" onclick="createNewGame()">Vytvořit novou hru</a>
            <div id="game-list">
                <p>Momentálně nejsou k dispozici žádné hry.</p>
            </div>
        </div>
        <div class="content">
            <img src="https://via.placeholder.com/800x400" alt="Popis obrázku místnosti" id="room-image" style="width: 100%; height: auto;" />
            <p id="room-description">Zde bude popis místnosti...</p>
        </div>
    </div>
    <div id="game-room" class="hidden">
        <div class="menu">
            <a href="#" onclick="returnToMain()">Zpět</a>
        </div>
        <div class="content">
            <div class="messages-container" id="messages"></div>
            <div class="input-area">
                <input type="text" id="username" placeholder="Zadejte jméno postavy">
                <textarea id="message" placeholder="Napište zprávu..."></textarea>
                <button onclick="sendMessage()">Odeslat</button>
                <button onclick="summonAI()">Přizvat AI vypravěče</button>
            </div>
        </div>
    </div>
    <script>
        const mainPage = document.getElementById("main-page");
        const gameRoom = document.getElementById("game-room");
        const messagesDiv = document.getElementById("messages");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");

        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                const gameList = document.getElementById("game-list");
                const newGame = document.createElement("a");
                newGame.textContent = gameName;
                newGame.href = "#";
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        function enterGame(gameName) {
            mainPage.classList.add("hidden");
            gameRoom.classList.remove("hidden");
            messagesDiv.innerHTML = ""; // Vyčistit zprávy
        }

        function returnToMain() {
            gameRoom.classList.add("hidden");
            mainPage.classList.remove("hidden");
        }

        function sendMessage() {
            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();

            if (!username || !message) {
                alert("Vyplňte jméno postavy i zprávu!");
                return;
            }

            const messageDiv = document.createElement("div");
            messageDiv.className = "message";
            const messageUser = document.createElement("strong");
            messageUser.textContent = username;
            const messageText = document.createElement("p");
            messageText.textContent = message;

            messageDiv.appendChild(messageUser);
            messageDiv.appendChild(messageText);
            messagesDiv.appendChild(messageDiv);

            messageInput.value = ""; // Vyčistit pole pro zprávu
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Posunout scroll dolů
        }

        function summonAI() {
            alert("Funkce AI vypravěče je zatím ve vývoji.");
        }
    </script>
</body>
</html>
