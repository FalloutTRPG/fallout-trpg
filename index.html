<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout Textová Hra</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 20%;
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 80%;
            float: left;
            padding: 10px;
            box-sizing: border-box;
            height: calc(100vh - 100px);
            overflow-y: auto;
        }
        .menu a {
            color: #00ee00;
            text-decoration: none;
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
        }
        .menu a:hover {
            background-color: #00ee00;
            color: #000000;
        }
        .hidden {
            display: none;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            border-radius: 5px;
            text-align: justify;
            white-space: pre-wrap; /* Zachová formátování */
        }
        .message strong {
            display: block;
            margin-bottom: 5px;
            color: #00ff00;
        }
        .input-area {
            position: fixed;
            bottom: 0;
            left: 20%;
            width: 80%;
            background-color: #000000;
            border-top: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .input-area input, .input-area textarea, .input-area button {
            width: calc(100% - 20px);
            padding: 10px;
            background-color: #000000;
            color: #00ee00;
            border: 1px solid #00ee00;
            border-radius: 5px;
            font-family: Futura, sans-serif;
        }
        .input-area button {
            cursor: pointer;
        }
        .input-area input:focus, .input-area textarea:focus, .input-area button:focus {
            outline: none;
            border-color: #00ff00;
        }
        .intro-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Rozcestník -->
    <div id="rozcestnik" class="intro-page">
        <div>
            <h1>Fallout Textová Hra</h1>
            <a href="#" onclick="enterMistnost('les')">Les</a>
            <a href="#" onclick="enterMistnost('mesto')">Město</a>
            <a href="#" onclick="enterMistnost('poušť')">Poušť</a>
        </div>
    </div>

    <!-- Místnost -->
    <div id="mistnost" class="hidden">
        <div class="menu">
            <a href="#" onclick="returnToRozcestnik()">Zpět</a>
            <a href="#" onclick="createHra()">Vytvořit novou hru</a>
            <div id="seznam-her">
                <p>Momentálně nejsou k dispozici žádné hry.</p>
            </div>
        </div>
        <div class="content">
            <img src="" alt="Popis obrázku místnosti" id="obrazek-mistnosti" style="width: 100%; height: auto;" />
            <p id="popis-mistnosti">Zde bude popis místnosti...</p>
        </div>
    </div>

    <!-- Hra -->
    <div id="hra" class="hidden">
        <div class="menu">
            <a href="#" onclick="returnToMistnost()">Zpět</a>
        </div>
        <div class="content">
            <div id="zpravy"></div>
        </div>
        <div class="input-area">
            <input type="text" id="jmeno-postavy" placeholder="Zadejte jméno postavy">
            <textarea id="zprava" placeholder="Napište, co vaše postava dělá..."></textarea>
            <button onclick="odeslatZpravu()">Odeslat</button>
        </div>
    </div>

    <script>
        const rozcestnik = document.getElementById("rozcestnik");
        const mistnost = document.getElementById("mistnost");
        const hra = document.getElementById("hra");
        const zpravyDiv = document.getElementById("zpravy");
        const jmenoPostavyInput = document.getElementById("jmeno-postavy");
        const zpravaInput = document.getElementById("zprava");
        const obrazekMistnosti = document.getElementById("obrazek-mistnosti");
        const popisMistnosti = document.getElementById("popis-mistnosti");

        // Data pro jednotlivá místa
        const mistnosti = {
            les: {
                obrazek: "https://via.placeholder.com/800x400?text=Les",
                popis: "Temný a tajuplný les plný nebezpečí a překvapení."
            },
            mesto: {
                obrazek: "https://via.placeholder.com/800x400?text=Město",
                popis: "Rozpadlé město plné ruin a přeživších."
            },
            poušť: {
                obrazek: "https://via.placeholder.com/800x400?text=Poušť",
                popis: "Vyprahlá poušť, kde přežijí jen ti nejsilnější."
            }
        };

        // Seznam her (zatím pouze v paměti prohlížeče)
        let hry = [];

        // Funkce pro vstup do místnosti
        function enterMistnost(mistnostNazev) {
            rozcestnik.classList.add("hidden");
            mistnost.classList.remove("hidden");

            // Nastavíme obrázek a popis místnosti
            obrazekMistnosti.src = mistnosti[mistnostNazev].obrazek;
            popisMistnosti.textContent = mistnosti[mistnostNazev].popis;
        }

        // Funkce pro návrat na rozcestník
        function returnToRozcestnik() {
            mistnost.classList.add("hidden");
            hra.classList.add("hidden");
            rozcestnik.classList.remove("hidden");
        }

        // Funkce pro návrat do místnosti
        function returnToMistnost() {
            hra.classList.add("hidden");
            mistnost.classList.remove("hidden");
        }

        // Funkce pro vytvoření nové hry
        function createHra() {
            const nazevHry = prompt("Zadejte název nové hry:");
            if (nazevHry) {
                hry.push(nazevHry); // Přidá hru do seznamu
                const seznamHer = document.getElementById("seznam-her");
                const novaHra = document.createElement("a");
                novaHra.textContent = nazevHry;
                novaHra.href = "#";
                novaHra.onclick = () => enterHra(nazevHry);
                seznamHer.appendChild(novaHra);
            }
        }

        // Funkce pro vstup do hry
        function enterHra(nazevHry) {
            mistnost.classList.add("hidden");
            hra.classList.remove("hidden");
            zpravyDiv.innerHTML = ""; // Vyčistit zprávy
        }

        // Funkce pro odeslání zprávy (akce postavy)
        function odeslatZpravu() {
            const jmenoPostavy = jmenoPostavyInput.value.trim();
            const zprava = zpravaInput.value.trim();

            if (!jmenoPostavy || !zprava) {
                alert("Vyplňte jméno postavy i akci!");
                return;
            }

            const zpravaDiv = document.createElement("div");
            zpravaDiv.className = "message";
            const zpravaUzivatel = document.createElement("strong");
            zpravaUzivatel.textContent = jmenoPostavy;
            const zpravaText = document.createElement("p");

            // Nahradíme nové řádky za <br> a zachováme formátování
            zpravaText.innerHTML = zprava.replace(/\n/g, "<br>");

            zpravaDiv.appendChild(zpravaUzivatel);
            zpravaDiv.appendChild(zpravaText);
            zpravyDiv.appendChild(zpravaDiv);

            zpravaInput.value = ""; // Vyčistit pole pro zprávu
        }
    </script>
</body>
</html>
