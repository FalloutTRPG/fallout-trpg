<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout TRPG</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 20%;
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 80%;
            float: left;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .menu a, .menu .button {
            color: #00ee00;
            text-decoration: none;
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            text-align: center;
            cursor: pointer;
        }
        .menu a:hover, .menu .button:hover {
            background-color: #00ee00;
            color: #000000;
        }
        .chat {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 50px);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid #00ee00;
            padding: 10px;
        }
        .chat-input {
            display: flex;
            flex-direction: column;
        }
        .chat-input input {
            margin-bottom: 5px;
            padding: 5px;
            border: 1px solid #00ee00;
            color: #00ee00;
            background-color: #000;
        }
        .chat-input button {
            padding: 10px;
            border: 1px solid #00ee00;
            background-color: transparent;
            color: #00ee00;
            cursor: pointer;
        }
        .chat-input button:hover {
            background-color: #00ee00;
            color: #000000;
        }
        .message {
            margin-bottom: 10px;
        }
        .message strong {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Fallout TRPG</h1>
        <div class="button" onclick="createNewGame()">Vytvořit novou hru</div>
        <div id="game-list">
            <p>Momentálně nejsou k dispozici žádné hry.</p>
        </div>
    </div>
    <div class="content">
        <div id="lobby">
            <img src="https://via.placeholder.com/800x400" alt="Popis obrázku místnosti" id="room-image" style="width: 100%; height: auto; margin-bottom: 10px;" />
            <p id="room-description">Místnost: N/A. Popis: Zde je popis místnosti.</p>
        </div>
        <div id="game-room" style="display: none;">
            <div class="chat">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="player-name" placeholder="Zadejte jméno postavy...">
                    <input type="text" id="message-input" placeholder="Napište zprávu...">
                    <button onclick="sendMessage()">Odeslat</button>
                    <button onclick="summonAI()">Přizvat AI vypravěče</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameList = document.getElementById("game-list");
        const lobby = document.getElementById("lobby");
        const gameRoom = document.getElementById("game-room");
        const chatMessages = document.getElementById("chat-messages");
        const playerNameInput = document.getElementById("player-name");
        const messageInput = document.getElementById("message-input");

        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                const newGame = document.createElement("div");
                newGame.textContent = gameName;
                newGame.className = "button";
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        function enterGame(gameName) {
            lobby.style.display = "none";
            gameRoom.style.display = "block";
            chatMessages.innerHTML = "";
        }

        function sendMessage() {
            const playerName = playerNameInput.value.trim();
            const message = messageInput.value.trim();
            if (playerName && message) {
                const messageElement = document.createElement("div");
                messageElement.className = "message";
                messageElement.innerHTML = `<strong>${playerName}:</strong> ${message}`;
                chatMessages.appendChild(messageElement);
                messageInput.value = "";
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                alert("Vyplňte prosím jméno postavy a zprávu.");
            }
        }

        function summonAI() {
            alert("Funkce AI vypravěče zatím není implementována.");
        }
    </script>
</body>
</html>
