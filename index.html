<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout TRPG</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 15%;
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 85%;
            float: left;
            padding: 10px;
            box-sizing: border-box;
        }
        .menu a {
            color: #00ee00;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }
        .button {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background-color: transparent;
            color: #00ee00;
            border: 1px solid #00ee00;
            text-align: center;
            cursor: pointer;
        }
        .button:hover {
            background-color: #00ee00;
            color: #000000;
        }
        .chat {
            margin-top: 20px;
        }
        .chat input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #00ee00;
            background-color: #000000;
            color: #00ee00;
            box-sizing: border-box;
        }
        .chat button {
            padding: 10px;
            border: 1px solid #00ee00;
            background-color: transparent;
            color: #00ee00;
            cursor: pointer;
        }
        .chat button:hover {
            background-color: #00ee00;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Fallout TRPG</h1>
        <button class="button" onclick="createNewGame()">Vytvořit novou hru</button>
        <div id="game-list">
            <p>Momentálně nejsou k dispozici žádné hry.</p>
        </div>
    </div>
    <div class="content" id="room-content">
        <img src="https://via.placeholder.com/800x400" alt="Popis obrázku místnosti" id="room-image" style="width: 100%; height: auto;" />
        <p id="room-description">Místnost: N/A. Popis: Zde je popis místnosti.</p>
        <div class="chat" id="chat-section" style="display: none;">
            <input type="text" id="character-name" placeholder="Zadejte jméno postavy" />
            <div id="messages"></div>
            <input type="text" id="message-input" placeholder="Napište zprávu..." />
            <button onclick="sendMessage()">Odeslat</button>
            <button onclick="inviteAI()">Přizvat AI vypravěče</button>
        </div>
    </div>

    <script>
        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                const gameList = document.getElementById("game-list");
                const newGame = document.createElement("div");
                newGame.textContent = gameName;
                newGame.className = "button";
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        function enterGame(gameName) {
            document.getElementById("room-description").textContent = `Místnost: ${gameName}. Popis: Tady je popis místnosti.`;
            document.getElementById("chat-section").style.display = "block";
        }

        function sendMessage() {
            const characterName = document.getElementById("character-name").value;
            const messageInput = document.getElementById("message-input").value;
            const messages = document.getElementById("messages");

            if (!characterName) {
                alert("Prosím, zadejte jméno postavy!");
                return;
            }

            if (messageInput.trim() === "") {
                alert("Zpráva nemůže být prázdná!");
                return;
            }

            const message = document.createElement("p");
            message.textContent = `${characterName}: ${messageInput}`;
            messages.appendChild(message);

            document.getElementById("message-input").value = "";
        }

        function inviteAI() {
            alert("AI vypravěč je přizván! (Placeholder)");
        }
    </script>
</body>
</html>
