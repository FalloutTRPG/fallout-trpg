<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout TRPG</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 20%;
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 80%;
            float: left;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
            overflow-y: auto;
        }
        .menu a {
            color: #00ee00;
            text-decoration: none;
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
        }
        .menu a:hover {
            background-color: #00ee00;
            color: #000000;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            border-radius: 5px;
            text-align: justify; /* Zarovnání textu do bloku */
        }
        .message strong {
            display: block;
            margin-bottom: 5px;
        }
        .input-area {
            position: fixed;
            bottom: 0;
            left: 20%;
            width: 80%;
            background-color: #000000;
            border-top: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
        }
        .input-area input, .input-area textarea, .input-area button {
            width: calc(33% - 20px);
            margin: 5px 5px 5px 0;
            padding: 10px;
            background-color: #000000;
            color: #00ee00;
            border: 1px solid #00ee00;
            border-radius: 5px;
            font-family: Futura, sans-serif;
        }
        .input-area button {
            cursor: pointer;
        }
        .input-area input:focus, .input-area textarea:focus, .input-area button:focus {
            outline: none;
            border-color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Fallout TRPG</h1>
        <a href="#" onclick="createNewGame()">Vytvořit novou hru</a>
        <div id="game-list">
            <p>Momentálně nejsou k dispozici žádné hry.</p>
        </div>
    </div>
    <div class="content">
        <div id="messages"></div>
    </div>
    <div class="input-area">
        <input type="text" id="username" placeholder="Zadejte jméno postavy">
        <textarea id="message" placeholder="Napište zprávu..."></textarea>
        <button onclick="sendMessage()">Odeslat</button>
        <button onclick="summonAI()">Přizvat AI vypravěče</button>
    </div>
    <script>
        const messagesDiv = document.getElementById("messages");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");

        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                const gameList = document.getElementById("game-list");
                const newGame = document.createElement("a");
                newGame.textContent = gameName;
                newGame.href = "#";
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        function enterGame(gameName) {
            alert("Vstupujete do hry: " + gameName);
            // Zde můžete přidat přesměrování nebo jiné funkce
        }

        function sendMessage() {
            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();

            if (!username || !message) {
                alert("Vyplňte jméno postavy i zprávu!");
                return;
            }

            const messageDiv = document.createElement("div");
            messageDiv.className = "message";
            const messageUser = document.createElement("strong");
            messageUser.textContent = username;
            const messageText = document.createElement("p");
            messageText.textContent = message;

            messageDiv.appendChild(messageUser);
            messageDiv.appendChild(messageText);
            messagesDiv.appendChild(messageDiv);

            messageInput.value = ""; // Vyčistit pole pro zprávu
        }

        function summonAI() {
            alert("Funkce AI vypravěče je zatím ve vývoji.");
        }
    </script>
</body>
</html>
