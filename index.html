<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout TRPG</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 15%; /* Zúženo menu */
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 85%; /* Rozšířeno obsah */
            float: left;
            padding: 10px;
            box-sizing: border-box;
        }
        .menu a {
            color: #00ee00;
            text-decoration: none;
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            text-align: center;
            background-color: transparent;
            cursor: pointer;
        }
        .menu a:hover {
            background-color: #00ee00;
            color: #000000;
        }
        .button {
            display: block;
            margin: 10px 0;
            padding: 8px; /* Zmenšeno tlačítko */
            background-color: transparent;
            color: #00ee00;
            border: 1px solid #00ee00;
            text-align: center;
            cursor: pointer;
        }
        .button:hover {
            background-color: #00ee00;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Fallout TRPG</h1>
        <button class="button" onclick="createNewGame()">Vytvořit novou hru</button>
        <div id="game-list">
            <p>Momentálně nejsou k dispozici žádné hry.</p>
        </div>
    </div>
    <div class="content">
        <img src="https://via.placeholder.com/800x400" alt="Popis obrázku místnosti" id="room-image" style="width: 100%; height: auto;" />
        <p id="room-description">Místnost: N/A. Popis: Zde je popis místnosti.</p>
    </div>
    <script>
        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                const gameList = document.getElementById("game-list");
                const newGame = document.createElement("div");
                newGame.textContent = gameName;
                newGame.className = "button";
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        function enterGame(gameName) {
            alert("Vstupujete do hry: " + gameName);
            // Přesměrování nebo načtení herní místnosti...
        }
    </script>
</body>
</html>
