<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout TRPG</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 20%;
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 80%;
            float: left;
            padding: 10px;
            box-sizing: border-box;
        }
        .menu a {
            color: #00ee00;
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }
        .menu a:hover {
            text-decoration: underline;
        }
        .button {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background-color: transparent;
            color: #00ee00;
            border: 1px solid #00ee00;
            text-align: center;
            cursor: pointer;
        }
        .button:hover {
            background-color: #00ee00;
            color: #000000;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Fallout TRPG</h1>
        <div class="button" onclick="createNewGame()">Vytvořit novou hru</div>
        <div id="game-list">
            <p>Momentálně nejsou k dispozici žádné hry.</p>
        </div>
    </div>
    <div class="content">
        <img src="https://via.placeholder.com/800x400" alt="Popis obrázku místnosti" id="room-image" style="width: 100%; height: auto;" />
        <p id="room-description">Místnost: <span id="room-name">N/A</span>. Popis: <span id="room-desc">Zde je popis místnosti.</span></p>
        <div id="chat-section" class="hidden">
            <div id="chat-messages">
                <p>Chat zprávy se zobrazí zde...</p>
            </div>
            <textarea id="chat-input" placeholder="Napište zprávu..."></textarea>
            <button onclick="sendMessage()">Odeslat</button>
            <button onclick="inviteAI()">Přizvat AI vypravěče</button>
        </div>
    </div>

    <script>
        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                const gameList = document.getElementById("game-list");
                const newGame = document.createElement("div");
                newGame.textContent = gameName;
                newGame.className = "button";
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        function enterGame(gameName) {
            document.getElementById("room-name").textContent = gameName;
            document.getElementById("room-desc").textContent = "Popis pro hru: " + gameName;
            document.getElementById("chat-section").classList.remove("hidden");
        }

        function sendMessage() {
            const input = document.getElementById("chat-input");
            const message = input.value.trim();
            if (message) {
                const chatMessages = document.getElementById("chat-messages");
                const newMessage = document.createElement("p");
                newMessage.textContent = message;
                chatMessages.appendChild(newMessage);
                input.value = "";
            }
        }

        function inviteAI() {
            alert("AI vypravěč bude přidán později!");
        }
    </script>
</body>
</html>
