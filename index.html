<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout Textová Hra</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
        }
        .menu {
            width: 20%;
            float: left;
            border-right: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
        }
        .content {
            width: 80%;
            float: left;
            padding: 10px;
            box-sizing: border-box;
            height: calc(100vh - 100px);
            overflow-y: auto;
        }
        .menu a {
            color: #00ee00;
            text-decoration: none;
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
        }
        .menu a:hover {
            background-color: #00ee00;
            color: #000000;
        }
        .hidden {
            display: none;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ee00;
            border-radius: 5px;
            text-align: justify;
            white-space: pre-wrap; /* Zachová formátování */
        }
        .message strong {
            display: block;
            margin-bottom: 5px;
            color: #00ff00;
        }
        .input-area {
            position: fixed;
            bottom: 0;
            left: 20%;
            width: 80%;
            background-color: #000000;
            border-top: 1px solid #00ee00;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .input-area input, .input-area textarea, .input-area button {
            width: calc(100% - 20px);
            padding: 10px;
            background-color: #000000;
            color: #00ee00;
            border: 1px solid #00ee00;
            border-radius: 5px;
            font-family: Futura, sans-serif;
        }
        .input-area button {
            cursor: pointer;
        }
        .input-area input:focus, .input-area textarea:focus, .input-area button:focus {
            outline: none;
            border-color: #00ff00;
        }
        .intro-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Úvodní stránka (rozcestník) -->
    <div id="intro-page" class="intro-page">
        <div>
            <h1>Fallout Textová Hra</h1>
            <a href="#" onclick="enterLocation('les')">Les</a>
            <a href="#" onclick="enterLocation('mesto')">Město</a>
            <a href="#" onclick="enterLocation('poušť')">Poušť</a>
        </div>
    </div>

    <!-- Stránka místa -->
    <div id="location-page" class="hidden">
        <div class="menu">
            <a href="#" onclick="returnToIntro()">Zpět</a>
            <a href="#" onclick="createNewGame()">Vytvořit novou hru</a>
            <div id="game-list">
                <p>Momentálně nejsou k dispozici žádné hry.</p>
            </div>
        </div>
        <div class="content">
            <img src="" alt="Popis obrázku místnosti" id="location-image" style="width: 100%; height: auto;" />
            <p id="location-description">Zde bude popis místnosti...</p>
        </div>
    </div>

    <!-- Herní místnost -->
    <div id="game-room" class="hidden">
        <div class="menu">
            <a href="#" onclick="returnToLocation()">Zpět</a>
        </div>
        <div class="content">
            <div id="messages"></div>
        </div>
        <div class="input-area">
            <input type="text" id="username" placeholder="Zadejte jméno postavy">
            <textarea id="message" placeholder="Napište, co vaše postava dělá..."></textarea>
            <button onclick="sendMessage()">Odeslat</button>
        </div>
    </div>

    <script>
        const introPage = document.getElementById("intro-page");
        const locationPage = document.getElementById("location-page");
        const gameRoom = document.getElementById("game-room");
        const messagesDiv = document.getElementById("messages");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");
        const locationImage = document.getElementById("location-image");
        const locationDescription = document.getElementById("location-description");

        // Data pro jednotlivá místa
        const locations = {
            les: {
                image: "https://via.placeholder.com/800x400?text=Les",
                description: "Temný a tajuplný les plný nebezpečí a překvapení."
            },
            mesto: {
                image: "https://via.placeholder.com/800x400?text=Město",
                description: "Rozpadlé město plné ruin a přeživších."
            },
            poušť: {
                image: "https://via.placeholder.com/800x400?text=Poušť",
                description: "Vyprahlá poušť, kde přežijí jen ti nejsilnější."
            }
        };

        // Seznam her (zatím pouze v paměti prohlížeče)
        let games = [];

        // Funkce pro vstup do místa
        function enterLocation(location) {
            introPage.classList.add("hidden");
            locationPage.classList.remove("hidden");

            // Nastavíme obrázek a popis místa
            locationImage.src = locations[location].image;
            locationDescription.textContent = locations[location].description;
        }

        // Funkce pro návrat na úvodní stránku
        function returnToIntro() {
            locationPage.classList.add("hidden");
            gameRoom.classList.add("hidden");
            introPage.classList.remove("hidden");
        }

        // Funkce pro návrat na stránku místa
        function returnToLocation() {
            gameRoom.classList.add("hidden");
            locationPage.classList.remove("hidden");
        }

        // Funkce pro vytvoření nové hry
        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                games.push(gameName); // Přidá hru do seznamu
                const gameList = document.getElementById("game-list");
                const newGame = document.createElement("a");
                newGame.textContent = gameName;
                newGame.href = "#";
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        // Funkce pro vstup do hry
        function enterGame(gameName) {
            locationPage.classList.add("hidden");
            gameRoom.classList.remove("hidden");
            messagesDiv.innerHTML = ""; // Vyčistit zprávy
        }

        // Funkce pro odeslání zprávy (akce postavy)
        function sendMessage() {
            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();

            if (!username || !message) {
                alert("Vyplňte jméno postavy i akci!");
                return;
            }

            const messageDiv = document.createElement("div");
            messageDiv.className = "message";
            const messageUser = document.createElement("strong");
            messageUser.textContent = username;
            const messageText = document.createElement("p");

            // Nahradíme nové řádky za <br> a zachováme formátování
            messageText.innerHTML = message.replace(/\n/g, "<br>");

            messageDiv.appendChild(messageUser);
            messageDiv.appendChild(messageText);
            messagesDiv.appendChild(messageDiv);

            messageInput.value = ""; // Vyčistit pole pro zprávu
        }
    </script>
</body>
</html>
