<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout TRPG</title>
    <style>
        body {
            font-family: Futura, sans-serif;
            background-color: #000000;
            color: #00ee00;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        .menu {
            width: 25%;
            border-right: 1px solid #00ee00;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .content {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 20px 0;
        }

        .button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: transparent;
            color: #00ee00;
            border: 1px solid #00ee00;
            text-align: center;
            cursor: pointer;
        }

        .button:hover {
            background-color: #00ee00;
            color: #000000;
        }

        a {
            color: #00ee00;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #game-list {
            margin-top: 20px;
        }

        #room-image {
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        #room-description {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Fallout TRPG</h1>
        <div class="button" onclick="createNewGame()">Vytvořit novou hru</div>
        <div id="game-list">
            <p>Momentálně nejsou k dispozici žádné hry.</p>
        </div>
    </div>
    <div class="content">
        <img src="https://via.placeholder.com/800x400" alt="Popis obrázku místnosti" id="room-image" />
        <p id="room-description">Místnost: N/A. Popis: Zde je popis místnosti.</p>
    </div>

    <script>
        function createNewGame() {
            const gameName = prompt("Zadejte název nové hry:");
            if (gameName) {
                const gameList = document.getElementById("game-list");
                const newGame = document.createElement("div");
                newGame.textContent = gameName;
                newGame.className = "button";
                newGame.onclick = () => enterGame(gameName);
                gameList.appendChild(newGame);
            }
        }

        function enterGame(gameName) {
            alert("Vstupujete do hry: " + gameName);
            // Přesměrování nebo načtení herní místnosti...
        }
    </script>
</body>
</html>
